<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шпион — Мега версия</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial', sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            background: #16213e;
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            color: white;
            transition: all 0.2s ease;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #e94560;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }
        .subtitle {
            margin: 0 0 24px;
            color: #a0a0b0;
            font-size: 0.9rem;
        }
        .step-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #f5f5f5;
            min-height: 2em;
        }
        .role-card {
            background: #0f3460;
            padding: 30px 20px;
            border-radius: 24px;
            margin: 20px 0;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            word-break: break-word;
        }
        .role-card.spy {
            background: #4a0e0e;
            color: #ff6b6b;
            box-shadow: inset 0 0 30px rgba(255,0,0,0.2);
        }
        .player-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .pass-text {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: bold;
            margin: 12px 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        button {
            background: #533483;
            border: none;
            color: white;
            padding: 18px 24px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            min-width: 80px;
            box-shadow: 0 5px 0 #3b1f5e;
            letter-spacing: 1px;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #3b1f5e;
        }
        button.primary {
            background: #e94560;
            box-shadow: 0 5px 0 #a02040;
            width: 100%;
            margin-top: 8px;
            font-size: 1.5rem;
            padding: 20px;
        }
        button.primary:active {
            box-shadow: 0 1px 0 #a02040;
        }
        button.secondary {
            background: #2d4059;
            box-shadow: 0 5px 0 #1a2533;
            font-size: 1rem;
            padding: 12px 20px;
        }
        .hidden {
            display: none !important;
        }
        .info-text {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 12px;
        }
        .word-pair {
            background: #222;
            border-radius: 16px;
            padding: 8px;
            margin: 8px 0;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- ЭКРАН 1: ВЫБОР КОЛИЧЕСТВА ИГРОКОВ -->
        <div id="screen-select">
            <h1>🕵️ ШПИОН</h1>
            <p class="subtitle">Мега версия • 100+ локаций</p>
            <div class="step-title">На сколько человек играем?</div>
            <div class="btn-grid" id="player-select">
                <!-- Кнопки добавятся из JS -->
            </div>
            <div class="info-text">Минимум 3, максимум 10</div>
        </div>

        <!-- ЭКРАН 2: ПЕРЕДАЧА ТЕЛЕФОНА И ПОКАЗ РОЛИ -->
        <div id="screen-role" class="hidden">
            <div id="player-header" class="player-badge">Игрок 1</div>
            <div class="step-title" id="role-instruction">Посмотри слово и передай телефон</div>
            <div id="role-display" class="role-card">СЛОВО</div>
            <div class="pass-text" id="pass-message">📱 Передай телефон →</div>
            <button class="primary" id="next-player-btn">Следующий игрок</button>
            <button class="secondary" id="restart-from-role">🔄 Заново</button>
        </div>

        <!-- ЭКРАН 3: НАЧАЛО ИГРЫ -->
        <div id="screen-start" class="hidden">
            <h1>🎉 ВСЁ!</h1>
            <div class="step-title">Роли розданы. Обсуждайте и найдите шпиона!</div>
            <div class="word-pair" id="final-words"></div>
            <button class="primary" id="restart-from-start">🔄 Играть ещё раз</button>
        </div>
    </div>

                { civilian: "Ресторан", spy: "Кафе" },

                // --- РАЗВЛЕЧЕНИЯ И ХОББИ ---

                // --- ПРОФЕССИИ ---
                { civilian: "Врач", spy: "Ветеринар" },
                { civilian: "Повар", spy: "Кондитер" },
                { civilian: "Полицейский", spy: "Пожарный" },
                { civilian: "Учитель", spy: "Профессор" },
                { civilian: "Пилот", spy: "Стюардесса" },

                // --- ТЕХНИКА ---
                { civilian: "Телефон", spy: "Планшет" },
                { civilian: "Компьютер", spy: "Ноутбук" },
                { civilian: "Телевизор", spy: "Монитор" },
                { civilian: "Наушники", spy: "Колонка" },
                { civilian: "Холодильник", spy: "Морозилка" },
                { civilian: "Пылесос", spy: "Веник" },

                // --- РАЗНОЕ ---
                { civilian: "Деньги", spy: "Банковская карта" },
                { civilian: "Книга", spy: "Журнал" },
                { civilian: "Зеркало", spy: "Окно" },
                { civilian: "Ключ", spy: "Замок" },
                { civilian: "Зонт", spy: "Плащ" },
                { civilian: "Подушка", spy: "Одеяло" },
                { civilian: "Зубная паста", spy: "Мыло" },
                { civilian: "Духи", spy: "Дезодорант" },
                { civilian: "Рюкзак", spy: "Сумка" },
                { civilian: "Подарок", spy: "Сюрприз" },
                { civilian: "Свеча", spy: "Лампа" },
                { civilian: "Бумага", spy: "Картон" },
                { civilian: "Ножницы", spy: "Нож" },
                { civilian: "Молоток", spy: "Отвёртка" },
                { civilian: "Колесо", spy: "Руль" },
                { civilian: "Лестница", spy: "Эскалатор" },

                // --- МУЛЬТФИЛЬМЫ И ИГРЫ ---
                { civilian: "Спанч Боб", spy: "Патрик" },
                { civilian: "Микки Маус", spy: "Дональд Дак" },
                { civilian: "Бэтмен", spy: "Супермен" },
                { civilian: "Марио", spy: "Луиджи" },
                { civilian: "Покемон", spy: "Дигимон" },
                { civilian: "Шрек", spy: "Фиона" },
                { civilian: "Мстители", spy: "Лига Справедливости" },
                { civilian: "Гарри Поттер", spy: "Рон Уизли" }
            ];

            // --- СОСТОЯНИЕ ---
            let totalPlayers = 3;
            let currentPlayerIndex = 0;
            let currentPair = null;
            let spyIndex = -1;
            
            // Флаг, чтобы одна и та же пара не выпадала два раза подряд (опционально)
            let lastPairIndex = -1;

            // --- ЭЛЕМЕНТЫ ---
            const screenSelect = document.getElementById('screen-select');
            const screenRole = document.getElementById('screen-role');
            const screenStart = document.getElementById('screen-start');
            
            const playerSelectDiv = document.getElementById('player-select');
            const playerHeader = document.getElementById('player-header');
            const roleDisplay = document.getElementById('role-display');
            const passMessage = document.getElementById('pass-message');
            const nextPlayerBtn = document.getElementById('next-player-btn');
            const restartFromRole = document.getElementById('restart-from-role');
            const restartFromStart = document.getElementById('restart-from-start');
            const finalWords = document.getElementById('final-words');

            // --- ФУНКЦИИ ---
            function showScreen(screen) {
                [screenSelect, screenRole, screenStart].forEach(s => s.classList.add('hidden'));
                screen.classList.remove('hidden');
            }

            function initPlayerButtons() {
                playerSelectDiv.innerHTML = '';
                // Минимум 3 игрока, максимум 10
                for (let i = 3; i <= 10; i++) {
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    btn.addEventListener('click', () => {
                        totalPlayers = i;
                        startRoleAssignment();
                    });
                    playerSelectDiv.appendChild(btn);
                }
            }

            function startRoleAssignment() {
                currentPlayerIndex = 0;
                // Выбираем случайную пару, но не такую же, как в прошлый раз (если это возможно)
                let randomPairIndex;
                do {
                    randomPairIndex = Math.floor(Math.random() * WORD_PAIRS.length);
                } while (randomPairIndex === lastPairIndex && WORD_PAIRS.length > 1);
                
                lastPairIndex = randomPairIndex;
                currentPair = WORD_PAIRS[randomPairIndex];
                
                // Выбираем случайного шпиона (0..totalPlayers-1)
                spyIndex = Math.floor(Math.random() * totalPlayers);
                
                showScreen(screenRole);
                updateRoleScreen();
            }

            function updateRoleScreen() {
                const playerNum = currentPlayerIndex + 1;
                const isLastPlayer = currentPlayerIndex === totalPlayers - 1;
                const isSpy = currentPlayerIndex === spyIndex;
                
                playerHeader.textContent = `Игрок ${playerNum}`;
                
                if (isSpy) {
                    roleDisplay.textContent = currentPair.spy;
                    roleDisplay.classList.add('spy');
                } else {
                    roleDisplay.textContent = currentPair.civilian;
                    roleDisplay.classList.remove('spy');
                }
                
                if (isLastPlayer) {
                    passMessage.textContent = "✅ Все посмотрели!";
                    nextPlayerBtn.textContent = "🏁 Начать игру";
                } else {
                    passMessage.textContent = `📱 Передай телефон Игроку ${playerNum + 1}`;
                    nextPlayerBtn.textContent = "👁️ Скрыть и передать";
                }
                
                // Убираем старый обработчик
                nextPlayerBtn.onclick = () => {
                    if (currentPlayerIndex < totalPlayers - 1) {
                        currentPlayerIndex++;
                        updateRoleScreen();
                    } else {
                        showStartScreen();
                    }
                };
            }

            function showStartScreen() {
                finalWords.innerHTML = `
                    <div>🔵 Мирные: <b>${currentPair.civilian}</b></div>
                    <div>🔴 Шпион: <b>${currentPair.spy}</b> (игрок №${spyIndex + 1})</div>
                `;
                showScreen(screenStart);
            }

            function resetToMenu() {
                showScreen(screenSelect);
            }

            // --- ЗАПУСК ---
            initPlayerButtons();
            
            restartFromRole.addEventListener('click', resetToMenu);
            restartFromStart.addEventListener('click', resetToMenu);
            
            showScreen(screenSelect);
        })();
    </script>
</body>
</html>

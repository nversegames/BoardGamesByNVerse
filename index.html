<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шпион — Быстрая игра</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* Чтобы нельзя было случайно выделить текст */
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial', sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            background: #16213e;
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            color: white;
            transition: all 0.2s ease;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #e94560;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }
        .subtitle {
            margin: 0 0 24px;
            color: #a0a0b0;
            font-size: 0.9rem;
        }
        .step-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #f5f5f5;
            min-height: 2em;
        }
        .role-card {
            background: #0f3460;
            padding: 30px 20px;
            border-radius: 24px;
            margin: 20px 0;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            word-break: break-word;
        }
        .role-card.spy {
            background: #4a0e0e;
            color: #ff6b6b;
            box-shadow: inset 0 0 30px rgba(255,0,0,0.2);
        }
        .player-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .pass-text {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: bold;
            margin: 12px 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        button {
            background: #533483;
            border: none;
            color: white;
            padding: 18px 24px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            min-width: 80px;
            box-shadow: 0 5px 0 #3b1f5e;
            letter-spacing: 1px;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #3b1f5e;
        }
        button.primary {
            background: #e94560;
            box-shadow: 0 5px 0 #a02040;
            width: 100%;
            margin-top: 8px;
            font-size: 1.5rem;
            padding: 20px;
        }
        button.primary:active {
            box-shadow: 0 1px 0 #a02040;
        }
        button.secondary {
            background: #2d4059;
            box-shadow: 0 5px 0 #1a2533;
            font-size: 1rem;
            padding: 12px 20px;
        }
        .hidden {
            display: none !important;
        }
        .info-text {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 12px;
        }
        .word-pair {
            background: #222;
            border-radius: 16px;
            padding: 8px;
            margin: 8px 0;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- ЭКРАН 1: ВЫБОР КОЛИЧЕСТВА ИГРОКОВ -->
        <div id="screen-select">
            <h1>🕵️ ШПИОН</h1>
            <p class="subtitle">Игра на вечеринку</p>
            <div class="step-title">На сколько человек играем?</div>
            <div class="btn-grid" id="player-select">
                <!-- Кнопки добавятся из JS -->
            </div>
            <div class="info-text">Минимум 2, максимум 10</div>
        </div>

        <!-- ЭКРАН 2: ПЕРЕДАЧА ТЕЛЕФОНА И ПОКАЗ РОЛИ -->
        <div id="screen-role" class="hidden">
            <div id="player-header" class="player-badge">Игрок 1</div>
            <div class="step-title" id="role-instruction">Посмотри слово и передай телефон</div>
            <div id="role-display" class="role-card">СЛОВО</div>
            <div class="pass-text" id="pass-message">📱 Передай телефон →</div>
            <button class="primary" id="next-player-btn">Следующий игрок</button>
            <button class="secondary" id="restart-from-role">🔄 Заново</button>
        </div>

        <!-- ЭКРАН 3: НАЧАЛО ИГРЫ -->
        <div id="screen-start" class="hidden">
            <h1>🎉 ВСЁ!</h1>
            <div class="step-title">Роли розданы. Обсуждайте и найдите шпиона!</div>
            <div class="word-pair" id="final-words"></div>
            <button class="primary" id="restart-from-start">🔄 Играть ещё раз</button>
        </div>
    </div>

    <script>
        (function(){
            // --- НАСТРОЙКИ ИГРЫ ---
            // Слова подобраны так, чтобы было похоже и не сразу понятно
            const WORD_PAIRS = [
                { civilian: "Арбуз", spy: "Дыня" },
                { civilian: "Банан", spy: "Клубника" }, // Твой пример
                { civilian: "Кофе", spy: "Чай" },
                { civilian: "Спанч Боб", spy: "Патрик" }, // Твой пример с мультиком
                { civilian: "Пицца", spy: "Бургер" },
                { civilian: "Такси", spy: "Автобус" },
                { civilian: "Лето", spy: "Весна" },
                { civilian: "Собака", spy: "Кошка" },
                { civilian: "Кинотеатр", spy: "Театр" },
                { civilian: "Йога", spy: "Пилатес" }
            ];

            // --- СОСТОЯНИЕ ---
            let totalPlayers = 3;
            let currentPlayerIndex = 0; // 0-based
            let currentPair = null;
            let spyIndex = -1;

            // --- ЭЛЕМЕНТЫ ---
            const screenSelect = document.getElementById('screen-select');
            const screenRole = document.getElementById('screen-role');
            const screenStart = document.getElementById('screen-start');
            
            const playerSelectDiv = document.getElementById('player-select');
            const playerHeader = document.getElementById('player-header');
            const roleDisplay = document.getElementById('role-display');
            const passMessage = document.getElementById('pass-message');
            const nextPlayerBtn = document.getElementById('next-player-btn');
            const restartFromRole = document.getElementById('restart-from-role');
            const restartFromStart = document.getElementById('restart-from-start');
            const finalWords = document.getElementById('final-words');

            // --- ФУНКЦИИ ---
            function showScreen(screen) {
                // Скрыть все
                [screenSelect, screenRole, screenStart].forEach(s => s.classList.add('hidden'));
                // Показать нужный
                screen.classList.remove('hidden');
            }

            function initPlayerButtons() {
                playerSelectDiv.innerHTML = '';
                // Кнопки 2-10
                for (let i = 2; i <= 10; i++) {
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    btn.addEventListener('click', () => {
                        totalPlayers = i;
                        startRoleAssignment();
                    });
                    playerSelectDiv.appendChild(btn);
                }
            }

            // Выбор случайной пары слов и назначение шпиона
            function startRoleAssignment() {
                // Сброс
                currentPlayerIndex = 0;
                // Выбрать случайную пару
                const randomPairIndex = Math.floor(Math.random() * WORD_PAIRS.length);
                currentPair = WORD_PAIRS[randomPairIndex];
                // Выбрать случайного шпиона (0..totalPlayers-1)
                spyIndex = Math.floor(Math.random() * totalPlayers);
                
                // Переключиться на экран ролей
                showScreen(screenRole);
                updateRoleScreen();
            }

            function updateRoleScreen() {
                const playerNum = currentPlayerIndex + 1;
                const isLastPlayer = currentPlayerIndex === totalPlayers - 1;
                const isSpy = currentPlayerIndex === spyIndex;
                
                // Шапка: "Игрок X"
                playerHeader.textContent = `Игрок ${playerNum}`;
                
                // Если шпион, показываем его слово, иначе гражданского
                if (isSpy) {
                    roleDisplay.textContent = currentPair.spy;
                    roleDisplay.classList.add('spy');
                    // Небольшая подсказка, чтобы шпион знал, что он шпион (но не выдавал себя)
                    // В реальной игре лучше просто показать слово без явной надписи "ШПИОН", чтобы никто не увидел.
                    // Но можно сделать иначе: просто слово, а игрок сам догадается при обсуждении.
                    // Для удобства оставим слово, а для теста можно убрать класс 'spy', если не хочешь выделять.
                } else {
                    roleDisplay.textContent = currentPair.civilian;
                    roleDisplay.classList.remove('spy');
                }
                
                // Сообщение о передаче
                if (isLastPlayer) {
                    passMessage.textContent = "✅ Все посмотрели!";
                    nextPlayerBtn.textContent = "🏁 Начать игру";
                    nextPlayerBtn.classList.add('primary');
                } else {
                    passMessage.textContent = `📱 Передай телефон Игроку ${playerNum + 1}`;
                    nextPlayerBtn.textContent = "👁️ Скрыть и передать";
                }
                
                // Обработчик кнопки "Следующий"
                // Сначала удалим старый обработчик, чтобы не дублировался
                nextPlayerBtn.onclick = () => {
                    if (currentPlayerIndex < totalPlayers - 1) {
                        // Переход к следующему игроку
                        currentPlayerIndex++;
                        updateRoleScreen();
                    } else {
                        // Это был последний игрок -> Завершаем раздачу
                        showStartScreen();
                    }
                };
            }

            function showStartScreen() {
                // Показать слова (чтобы ведущий видел, но в реальной игре можно не показывать)
                finalWords.innerHTML = `
                    <div>🔵 Мирные: <b>${currentPair.civilian}</b></div>
                    <div>🔴 Шпион: <b>${currentPair.spy}</b> (игрок №${spyIndex + 1})</div>
                `;
                showScreen(screenStart);
            }

            function resetToMenu() {
                showScreen(screenSelect);
            }

            // --- ИНИЦИАЛИЗАЦИЯ ---
            initPlayerButtons();

            // Кнопки возврата в меню
            restartFromRole.addEventListener('click', resetToMenu);
            restartFromStart.addEventListener('click', resetToMenu);

            // Показ стартового экрана
            showScreen(screenSelect);
        })();
    </script>
</body>
</html>

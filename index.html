<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мафия — Онлайн игра</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --gold: #e2b714;
            --red: #e74c3c;
            --green: #2ecc71;
            --blue: #3498db;
            --text: #eee;
            --text-muted: #aaa;
            --border: #2a2a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.5s ease;
        }

        body.night-mode {
            background: linear-gradient(135deg, #050510 0%, #0a0a1a 50%, #050510 100%);
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 3em;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(226, 183, 20, 0.5);
            letter-spacing: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 10px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .player-selector {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .player-btn {
            padding: 15px 25px;
            border: 2px solid var(--border);
            background: transparent;
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        .player-btn:hover, .player-btn.active {
            border-color: var(--gold);
            background: rgba(226, 183, 20, 0.2);
            color: var(--gold);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--gold);
            color: #1a1a2e;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(226, 183, 20, 0.4);
        }

        .btn-blue {
            background: var(--blue);
            color: white;
        }

        .btn-blue:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }

        .btn-green {
            background: var(--green);
            color: white;
        }

        .btn-red {
            background: var(--red);
            color: white;
        }

        .input-field {
            padding: 15px;
            border: 2px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border-radius: 10px;
            font-size: 1.1em;
            width: 100%;
            max-width: 400px;
            margin: 10px 0;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--gold);
        }

        .room-id {
            font-size: 1.5em;
            color: var(--gold);
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            user-select: all;
            cursor: pointer;
            letter-spacing: 2px;
        }

        .status-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .status-badge {
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
        }

        .status-online {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid var(--green);
            color: var(--green);
        }

        .status-waiting {
            background: rgba(241, 196, 15, 0.2);
            border: 1px solid #f1c40f;
            color: #f1c40f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .phase-banner {
            text-align: center;
            font-size: 1.5em;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .phase-day {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #f1c40f;
        }

        .phase-night {
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            color: #bdc3c7;
            border: 1px solid #333;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 2px solid var(--border);
            transition: all 0.3s;
            position: relative;
            cursor: pointer;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
        }

        .player-card.dead {
            opacity: 0.4;
            pointer-events: none;
        }

        .player-card.voted {
            border-color: var(--red);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
        }

        .player-card.me {
            border-color: var(--blue);
            background: rgba(52, 152, 219, 0.15);
        }

        .player-avatar {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .player-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .player-role {
            font-size: 0.8em;
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .log {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 2px solid var(--gold);
            animation: modalIn 0.3s;
        }

        @keyframes modalIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .role-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .role-name {
            font-size: 1.8em;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .role-description {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .players-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🔫 МАФИЯ</h1>
            <p class="subtitle">Онлайн игра для друзей</p>
        </div>

        <!-- Экран меню -->
        <div id="menuScreen" class="menu">
            <h2>Выберите количество игроков:</h2>
            <div class="player-selector">
                <button class="player-btn active" data-count="3">3 игрока</button>
                <button class="player-btn" data-count="4">4 игрока</button>
                <button class="player-btn" data-count="5">5 игроков</button>
                <button class="player-btn" data-count="6">6 игроков</button>
            </div>
            
            <button class="btn btn-primary" onclick="createRoom()">🏠 Создать комнату</button>
            
            <div style="margin-top: 30px; width: 100%; text-align: center;">
                <h3>Или подключитесь к существующей:</h3>
                <input type="text" id="roomIdInput" class="input-field" placeholder="Введите ID комнаты">
                <button class="btn btn-blue" onclick="joinRoom()">🔗 Подключиться</button>
            </div>
            <div id="errorMessage" class="error-message hidden"></div>
        </div>

        <!-- Экран игры -->
        <div id="gameScreen" class="hidden">
            <div style="text-align: center; margin-bottom: 20px;">
                <p>ID комнаты:</p>
                <div class="room-id" id="roomIdDisplay" onclick="copyRoomId()"></div>
                <button class="btn btn-blue" onclick="copyRoomId()" style="font-size: 0.8em; padding: 8px 15px;">📋 Копировать</button>
            </div>

            <div class="status-container" id="statusContainer"></div>

            <div id="phaseBanner" class="phase-banner phase-day">☀️ ДЕНЬ 1</div>

            <div class="players-grid" id="playersGrid"></div>

            <div class="actions" id="actionsArea">
                <button class="btn btn-primary" id="startBtn" onclick="startGame()" disabled>🎮 Начать игру</button>
                <button class="btn btn-green" id="nightBtn" onclick="goToNight()" disabled>🌙 Ночь</button>
                <button class="btn btn-blue" id="voteBtn" onclick="startVoting()" disabled>🗳️ Голосование</button>
            </div>

            <div class="log" id="gameLog">
                <div class="log-entry">Добро пожаловать в игру!</div>
            </div>

            <div id="gameOverArea" class="hidden"></div>
        </div>
    </div>

    <!-- Модальное окно роли -->
    <div class="modal" id="roleModal">
        <div class="modal-content">
            <div class="role-icon" id="modalRoleIcon"></div>
            <div class="role-name" id="modalRoleName"></div>
            <div class="role-description" id="modalRoleDescription"></div>
            <button class="btn btn-primary" onclick="closeRoleModal()" style="margin-top: 20px;">Понятно</button>
        </div>
    </div>

    <script>
        // Конфигурация
        const ROLES = {
            MAFIA: 'Мафия',
            DON: 'Дон',
            SHERIFF: 'Шериф',
            DOCTOR: 'Доктор',
            CIVILIAN: 'Мирный житель'
        };

        const ROLE_ICONS = {
            'Мафия': '🔫',
            'Дон': '👑',
            'Шериф': '🔍',
            'Доктор': '💉',
            'Мирный житель': '👤'
        };

        const ROLE_DESCRIPTIONS = {
            'Мафия': 'Вы - мафия. Ночью убивайте мирных жителей.',
            'Дон': 'Вы - дон мафии. Руководите мафией.',
            'Шериф': 'Вы - шериф. Ночью проверяйте игроков.',
            'Доктор': 'Вы - доктор. Ночью лечите игроков.',
            'Мирный житель': 'Вы - мирный житель. Найдите мафию.'
        };

        // Глобальные переменные
        let peer;
        let connections = [];
        let myPeerId;
        let isHost = false;
        let myPlayerIndex = -1;
        let selectedPlayers = 3;
        let roomId = '';

        // Состояние игры
        let gameState = {
            phase: 'day',
            day: 1,
            players: [],
            currentVotes: {},
            gameStarted: false,
            gameOver: false
        };

        // Выбор количества игроков
        document.querySelectorAll('.player-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedPlayers = parseInt(this.dataset.count);
            });
        });

        // Функция показа ошибки
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        // Инициализация PeerJS с облачным сервером
        function initPeer(id) {
            // Используем публичный сервер PeerJS
            peer = new Peer(id, {
                debug: 3,
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (peerId) => {
                myPeerId = peerId;
                console.log('Peer ID:', peerId);
                
                if (isHost) {
                    document.getElementById('roomIdDisplay').textContent = peerId;
                    roomId = peerId;
                }
            });

            peer.on('connection', (conn) => {
                console.log('Входящее соединение от:', conn.peer);
                conn.on('open', () => {
                    console.log('Соединение установлено');
                    connections.push(conn);
                    setupConnection(conn);
                    
                    if (isHost) {
                        // Назначаем игроку индекс
                        const playerIndex = connections.length;
                        if (playerIndex < selectedPlayers) {
                            console.log('Назначаем игроку индекс:', playerIndex);
                            conn.send({
                                type: 'assign-player',
                                playerIndex: playerIndex
                            });
                        }
                    }
                });
            });

            peer.on('disconnected', () => {
                console.log('Отключен от сервера, переподключаюсь...');
                peer.reconnect();
            });

            peer.on('error', (err) => {
                console.error('PeerJS error:', err);
                if (err.type === 'peer-unavailable') {
                    showError('Комната не найдена. Проверьте ID.');
                } else if (err.type === 'network') {
                    showError('Проблема с сетью. Попробуйте еще раз.');
                } else if (err.type === 'browser-incompatible') {
                    showError('Ваш браузер не поддерживает WebRTC. Используйте Chrome или Firefox.');
                } else {
                    showError('Ошибка: ' + err.type);
                }
            });
        }

        // Настройка соединения
        function setupConnection(conn) {
            conn.on('data', (data) => {
                console.log('Получены данные:', data);
                handleData(data, conn);
            });

            conn.on('close', () => {
                console.log('Соединение закрыто');
                connections = connections.filter(c => c !== conn);
                if (isHost) {
                    updateStatuses();
                }
            });

            conn.on('error', (err) => {
                console.error('Ошибка соединения:', err);
            });
        }

        // Обработка входящих данных
        function handleData(data, conn) {
            console.log('Обработка данных:', data.type);
            switch(data.type) {
                case 'assign-player':
                    myPlayerIndex = data.playerIndex;
                    console.log('Мой индекс игрока:', myPlayerIndex);
                    connectPlayer(data.playerIndex);
                    break;
                case 'player-connected':
                    connectPlayer(data.playerIndex);
                    break;
                case 'game-state':
                    updateGameState(data.gameState);
                    break;
                case 'vote':
                    handleVote(data.playerIndex, data.targetId);
                    break;
                case 'start-game':
                    startGame();
                    break;
                case 'night':
                    goToNight();
                    break;
                case 'game-over':
                    gameState.gameOver = true;
                    showGameOver(data.message);
                    break;
            }
        }

        // Отправка данных всем
        function broadcast(data) {
            connections.forEach(conn => {
                if (conn.open) {
                    console.log('Отправка данных:', data.type);
                    conn.send(data);
                }
            });
        }

        // Создание комнаты
        function createRoom() {
            roomId = 'mafia-' + Math.random().toString(36).substr(2, 8);
            isHost = true;
            myPlayerIndex = 0;
            
            console.log('Создание комнаты с ID:', roomId);
            initPeer(roomId);
            
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            initGame();
            connectPlayer(0);
            
            addLog('Комната создана. ID: ' + roomId);
            addLog('Отправьте ID друзьям для подключения');
            addLog('Ожидание игроков...');
        }

        // Подключение к комнате
        function joinRoom() {
            roomId = document.getElementById('roomIdInput').value.trim();
            if (!roomId) {
                showError('Введите ID комнаты');
                return;
            }
            
            console.log('Подключение к комнате:', roomId);
            isHost = false;
            myPeerId = 'player-' + Math.random().toString(36).substr(2, 8);
            
            initPeer(myPeerId);
            
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            // Подключаемся к хосту
            const conn = peer.connect(roomId, { 
                reliable: true,
                metadata: { playerName: 'Игрок' }
            });
            
            conn.on('open', () => {
                console.log('Подключение установлено');
                connections.push(conn);
                setupConnection(conn);
                addLog('Подключено к комнате!');
                addLog('Ожидание назначения роли...');
            });
            
            conn.on('error', (err) => {
                console.error('Ошибка подключения:', err);
                showError('Не удалось подключиться. Проверьте ID комнаты.');
            });
        }

        // Инициализация игры
        function initGame() {
            const roles = generateRoles();
            gameState.players = [];
            
            for (let i = 0; i < selectedPlayers; i++) {
                gameState.players.push({
                    id: i,
                    name: 'Игрок ' + (i + 1),
                    role: roles[i],
                    isAlive: true,
                    isConnected: false,
                    avatar: ROLE_ICONS[roles[i]]
                });
            }
            
            updateStatuses();
            updatePlayers();
            updatePhase();
        }

        // Генерация ролей
        function generateRoles() {
            const roles = [];
            const mafiaCount = Math.floor(selectedPlayers / 3) || 1;
            
            // Добавляем мафию
            if (mafiaCount === 1) {
                roles.push(ROLES.MAFIA);
            } else {
                roles.push(ROLES.DON);
                for (let i = 1; i < mafiaCount; i++) {
                    roles.push(ROLES.MAFIA);
                }
            }
            
            // Специальные роли
            if (selectedPlayers >= 4) {
                roles.push(ROLES.SHERIFF);
            }
            if (selectedPlayers >= 5) {
                roles.push(ROLES.DOCTOR);
            }
            
            // Остальные - мирные жители
            while (roles.length < selectedPlayers) {
                roles.push(ROLES.CIVILIAN);
            }
            
            // Перемешиваем
            for (let i = roles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [roles[i], roles[j]] = [roles[j], roles[i]];
            }
            
            return roles;
        }

        // Подключение игрока
        function connectPlayer(playerIndex) {
            console.log('Подключение игрока:', playerIndex);
            if (gameState.players[playerIndex]) {
                gameState.players[playerIndex].isConnected = true;
                
                if (playerIndex === myPlayerIndex) {
                    showRole(playerIndex);
                }
                
                updateStatuses();
                updatePlayers();
                addLog('Игрок ' + (playerIndex + 1) + ' подключился');
                
                if (isHost) {
                    broadcast({
                        type: 'player-connected',
                        playerIndex: playerIndex
                    });
                    
                    // Проверяем, все ли подключились
                    const allConnected = gameState.players.every(p => p.isConnected);
                    if (allConnected && gameState.players.length === selectedPlayers) {
                        document.getElementById('startBtn').disabled = false;
                        addLog('✅ Все игроки подключены! Можно начинать.');
                    }
                }
            }
        }

        // Показ роли игроку
        function showRole(playerIndex) {
            const player = gameState.players[playerIndex];
            if (player) {
                document.getElementById('modalRoleIcon').textContent = player.avatar;
                document.getElementById('modalRoleName').textContent = player.role;
                document.getElementById('modalRoleDescription').textContent = ROLE_DESCRIPTIONS[player.role] || 'Ваша роль.';
                document.getElementById('roleModal').classList.add('show');
            }
        }

        function closeRoleModal() {
            document.getElementById('roleModal').classList.remove('show');
        }

        // Обновление статусов
        function updateStatuses() {
            const container = document.getElementById('statusContainer');
            container.innerHTML = '';
            
            gameState.players.forEach(player => {
                const badge = document.createElement('div');
                badge.className = 'status-badge ' + (player.isConnected ? 'status-online' : 'status-waiting');
                badge.textContent = player.name + ': ' + (player.isConnected ? '✓ Подключен' : '⏳ Ожидание');
                container.appendChild(badge);
            });
        }

        // Обновление игроков
        function updatePlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';
            
            gameState.players.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.id = 'player-' + player.id;
                
                if (!player.isAlive) card.classList.add('dead');
                if (player.id === myPlayerIndex) card.classList.add('me');
                if (gameState.currentVotes[player.id]) card.classList.add('voted');
                
                card.innerHTML = `
                    <div class="player-avatar">${player.avatar}</div>
                    <div class="player-name">${player.name} ${player.isAlive ? '' : '💀'}</div>
                    <div class="player-role">${gameState.gameOver ? player.role : (player.id === myPlayerIndex ? 'Ваша роль: ' + player.role : 'Роль скрыта')}</div>
                `;
                
                if (gameState.phase === 'voting' && player.isAlive && player.id !== myPlayerIndex) {
                    card.onclick = () => voteFor(player.id);
                    card.style.cursor = 'pointer';
                }
                
                grid.appendChild(card);
            });
        }

        // Обновление фазы
        function updatePhase() {
            const banner = document.getElementById('phaseBanner');
            const body = document.body;
            
            if (gameState.phase === 'day') {
                banner.className = 'phase-banner phase-day';
                banner.textContent = '☀️ ДЕНЬ ' + gameState.day;
                body.classList.remove('night-mode');
            } else if (gameState.phase === 'night') {
                banner.className = 'phase-banner phase-night';
                banner.textContent = '🌙 НОЧЬ ' + gameState.day;
                body.classList.add('night-mode');
            } else if (gameState.phase === 'voting') {
                banner.className = 'phase-banner phase-day';
                banner.textContent = '🗳️ ГОЛОСОВАНИЕ';
                body.classList.remove('night-mode');
            }
        }

        // Добавление лога
        function addLog(message) {
            const log = document.getElementById('gameLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = message;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // Копирование ID
        function copyRoomId() {
            navigator.clipboard.writeText(roomId).then(() => {
                alert('ID скопирован!');
            }).catch(() => {
                // Fallback
                const input = document.createElement('input');
                input.value = roomId;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('ID скопирован!');
            });
        }

        // Начало игры
        function startGame() {
            if (gameState.gameStarted) return;
            
            gameState.gameStarted = true;
            gameState.phase = 'day';
            gameState.day = 1;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('nightBtn').disabled = false;
            document.getElementById('voteBtn').disabled = false;
            
            addLog('🎮 Игра началась!');
            updatePhase();
            
            if (isHost) {
                broadcast({ type: 'start-game' });
                broadcast({ type: 'game-state', gameState: gameState });
            }
        }

        // Ночь
        function goToNight() {
            if (gameState.phase !== 'day') return;
            
            gameState.phase = 'night';
            document.getElementById('nightBtn').disabled = true;
            document.getElementById('voteBtn').disabled = true;
            
            addLog('🌙 Город засыпает...');
            updatePhase();
            
            if (isHost) {
                broadcast({ type: 'night' });
                
                setTimeout(() => {
                    performNightActions();
                }, 3000);
            }
        }

        // Ночные действия
        function performNightActions() {
            if (!isHost) return;
            
            const alivePlayers = gameState.players.filter(p => p.isAlive);
            const mafia = alivePlayers.filter(p => p.role === ROLES.MAFIA || p.role === ROLES.DON);
            const civilians = alivePlayers.filter(p => p.role !== ROLES.MAFIA && p.role !== ROLES.DON);
            
            // Мафия убивает
            if (mafia.length > 0 && civilians.length > 0) {
                const target = civilians[Math.floor(Math.random() * civilians.length)];
                if (target) {
                    target.isAlive = false;
                    addLog('☠️ Мафия убила: ' + target.name);
                }
            }
            
            // Проверка победы
            if (checkWin()) return;
            
            // Новый день
            gameState.day++;
            gameState.phase = 'day';
            gameState.currentVotes = {};
            
            document.getElementById('nightBtn').disabled = false;
            document.getElementById('voteBtn').disabled = false;
            
            addLog('☀️ День ' + gameState.day + '. Город просыпается!');
            updatePhase();
            updatePlayers();
            
            broadcast({
                type: 'game-state',
                gameState: gameState
            });
        }

        // Голосование
        function startVoting() {
            if (gameState.phase !== 'day') return;
            
            gameState.phase = 'voting';
            gameState.currentVotes = {};
            
            document.getElementById('voteBtn').disabled = true;
            document.getElementById('nightBtn').disabled = true;
            
            addLog('🗳️ Голосование началось! Выберите игрока');
            updatePhase();
            updatePlayers();
            
            if (isHost) {
                // Боты голосуют
                setTimeout(() => {
                    const alivePlayers = gameState.players.filter(p => p.isAlive);
                    alivePlayers.forEach(bot => {
                        if (bot.id !== myPlayerIndex) {
                            const targets = alivePlayers.filter(p => p.id !== bot.id);
                            const target = targets[Math.floor(Math.random() * targets.length)];
                            if (target) {
                                gameState.currentVotes[target.id] = (gameState.currentVotes[target.id] || 0) + 1;
                            }
                        }
                    });
                    
                    determineVoteResult();
                }, 3000);
            }
        }

        // Голосование игрока
        function voteFor(playerId) {
            if (gameState.phase !== 'voting') return;
            
            gameState.currentVotes[playerId] = (gameState.currentVotes[playerId] || 0) + 1;
            addLog(gameState.players[myPlayerIndex].name + ' проголосовал против ' + gameState.players[playerId].name);
            
            if (isHost) {
                handleVote(myPlayerIndex, playerId);
            } else {
                broadcast({
                    type: 'vote',
                    playerIndex: myPlayerIndex,
                    targetId: playerId
                });
            }
            
            updatePlayers();
        }

        function handleVote(playerIndex, targetId) {
            gameState.currentVotes[targetId] = (gameState.currentVotes[targetId] || 0) + 1;
            addLog(gameState.players[playerIndex].name + ' проголосовал против ' + gameState.players[targetId].name);
            updatePlayers();
        }

        function determineVoteResult() {
            if (!isHost) return;
            
            let maxVotes = 0;
            let votedOut = null;
            
            Object.entries(gameState.currentVotes).forEach(([playerId, votes]) => {
                if (votes > maxVotes) {
                    maxVotes = votes;
                    votedOut = parseInt(playerId);
                }
            });
            
            if (votedOut !== null) {
                gameState.players[votedOut].isAlive = false;
                addLog('🚫 Изгнан: ' + gameState.players[votedOut].name);
            } else {
                addLog('🤝 Никто не изгнан');
            }
            
            if (checkWin()) return;
            
            gameState.phase = 'day';
            gameState.currentVotes = {};
            
            document.getElementById('voteBtn').disabled = false;
            document.getElementById('nightBtn').disabled = false;
            
            updatePhase();
            updatePlayers();
            
            broadcast({
                type: 'game-state',
                gameState: gameState
            });
        }

        // Проверка победы
        function checkWin() {
            const alivePlayers = gameState.players.filter(p => p.isAlive);
            const mafiaCount = alivePlayers.filter(p => p.role === ROLES.MAFIA || p.role === ROLES.DON).length;
            const civilianCount = alivePlayers.filter(p => p.role !== ROLES.MAFIA && p.role !== ROLES.DON).length;
            
            if (mafiaCount === 0) {
                showGameOver('🏆 Мирные жители победили!');
                return true;
            } else if (mafiaCount >= civilianCount) {
                showGameOver('🔫 Мафия победила!');
                return true;
            }
            
            return false;
        }

        function showGameOver(message) {
            gameState.gameOver = true;
            gameState.phase = 'day';
            
            const area = document.getElementById('gameOverArea');
            area.classList.remove('hidden');
            area.innerHTML = `
                <div style="text-align: center; padding: 40px; background: rgba(0,0,0,0.5); border-radius: 20px; margin-top: 20px;">
                    <h2 style="font-size: 2em; color: #e2b714; margin-bottom: 20px;">${message}</h2>
                    <button class="btn btn-primary" onclick="location.reload()">🔄 Новая игра</button>
                </div>
            `;
            
            document.getElementById('nightBtn').disabled = true;
            document.getElementById('voteBtn').disabled = true;
            
            updatePlayers();
            
            if (isHost) {
                broadcast({
                    type: 'game-over',
                    message: message
                });
            }
        }

        function updateGameState(newState) {
            if (!isHost) {
                gameState = newState;
                updatePlayers();
                updatePhase();
                updateStatuses();
            }
        }
    </script>
</body>
</html>

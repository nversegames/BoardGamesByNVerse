<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мафия — Онлайн игра</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --gold: #e2b714;
            --red: #e74c3c;
            --green: #2ecc71;
            --blue: #3498db;
            --dark: #1a1a2e;
            --darker: #0f0f1a;
            --card: #16213e;
            --text: #eee;
            --muted: #aaa;
            --border: #2a2a4a;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--darker), var(--dark));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 3em;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(226, 183, 20, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 20px rgba(226, 183, 20, 0.5); }
            50% { text-shadow: 0 0 40px rgba(226, 183, 20, 0.8); }
            100% { text-shadow: 0 0 20px rgba(226, 183, 20, 0.5); }
        }

        .menu {
            text-align: center;
        }

        .player-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .player-btn {
            padding: 12px 20px;
            border: 2px solid var(--border);
            background: transparent;
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .player-btn:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .player-btn.active {
            border-color: var(--gold);
            background: rgba(226, 183, 20, 0.2);
            color: var(--gold);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            margin: 5px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary { background: var(--gold); color: #000; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-red { background: var(--red); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .input-field {
            padding: 15px;
            border: 2px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border-radius: 10px;
            font-size: 16px;
            width: 80%;
            max-width: 400px;
            margin: 10px;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255,255,255,0.1);
        }

        .room-id {
            font-size: 24px;
            color: var(--gold);
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 15px;
            cursor: pointer;
            user-select: all;
            transition: all 0.3s;
        }

        .room-id:hover {
            background: rgba(0,0,0,0.5);
            transform: scale(1.02);
        }

        .status-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .status-badge {
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-online {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid var(--green);
            color: var(--green);
        }

        .status-waiting {
            background: rgba(241, 196, 15, 0.2);
            border: 1px solid #f1c40f;
            color: #f1c40f;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .phase-banner {
            text-align: center;
            font-size: 24px;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-weight: bold;
            animation: slideIn 0.5s ease;
        }

        .phase-day {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #f1c40f;
        }

        .phase-night {
            background: #0a0a1a;
            color: #bdc3c7;
            border: 1px solid #333;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .player-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 2px solid var(--border);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .player-card.dead { 
            opacity: 0.4; 
            pointer-events: none;
            filter: grayscale(100%);
        }

        .player-card.me {
            border-color: var(--blue);
            background: rgba(52, 152, 219, 0.15);
        }

        .player-card.mafia {
            border-color: var(--red);
            background: rgba(231, 76, 60, 0.15);
        }

        .player-avatar { 
            font-size: 40px; 
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .player-name { font-weight: bold; margin-bottom: 5px; }
        .player-role { font-size: 12px; color: var(--muted); }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .log {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 14px;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) transparent;
        }

        .log::-webkit-scrollbar {
            width: 8px;
        }

        .log::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }

        .log-entry {
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            animation: slideIn 0.3s ease;
        }

        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            text-align: center;
            border: 2px solid var(--gold);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .role-icon { font-size: 60px; margin-bottom: 20px; }
        .role-name { font-size: 28px; color: var(--gold); margin-bottom: 15px; }
        .role-description { color: var(--muted); line-height: 1.6; }

        .hidden { display: none !important; }

        .error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 15px;
            border-radius: 10px;
            margin: 10px;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 15px;
            border-radius: 10px;
            margin: 10px;
        }

        .game-over-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .game-over-overlay.show { display: flex; }

        .game-over-content {
            background: var(--card);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 3px solid var(--gold);
            animation: modalIn 0.5s ease;
        }

        .game-over-title {
            font-size: 3em;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .game-over-message {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        .players-list {
            margin: 20px 0;
            text-align: left;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .player-info .role {
            color: var(--gold);
            font-weight: bold;
        }

        .copy-tooltip {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--gold);
            color: #000;
            padding: 10px 20px;
            border-radius: 10px;
            animation: slideUp 0.3s ease;
            display: none;
        }

        .copy-tooltip.show { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            display: none;
        }

        .timer.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🔫 МАФИЯ</h1>
            <p style="color: var(--muted);">Онлайн игра для друзей</p>
        </div>

        <!-- МЕНЮ -->
        <div id="menuScreen" class="menu">
            <h2>Выберите количество игроков:</h2>
            <div class="player-selector">
                <button class="player-btn active" data-count="3">3 игрока</button>
                <button class="player-btn" data-count="4">4 игрока</button>
                <button class="player-btn" data-count="5">5 игроков</button>
                <button class="player-btn" data-count="6">6 игроков</button>
            </div>
            
            <button class="btn btn-primary" onclick="createRoom()">🏠 Создать комнату</button>
            
            <div style="margin-top: 30px;">
                <h3>Подключиться к комнате:</h3>
                <input type="text" id="roomIdInput" class="input-field" placeholder="Введите ID комнаты">
                <button class="btn btn-blue" onclick="joinRoom()">🔗 Подключиться</button>
            </div>
            <div id="errorMsg" class="error hidden"></div>
            <div id="successMsg" class="success hidden"></div>
        </div>

        <!-- ИГРА -->
        <div id="gameScreen" class="hidden">
            <div style="text-align: center;">
                <p>ID комнаты:</p>
                <div class="room-id" id="roomIdDisplay" onclick="copyRoomId()"></div>
                <button class="btn btn-blue" onclick="copyRoomId()">📋 Копировать</button>
            </div>

            <div class="status-container" id="statusContainer"></div>
            <div id="phaseBanner" class="phase-banner phase-day">☀️ ДЕНЬ 1</div>
            <div class="players-grid" id="playersGrid"></div>

            <div class="actions">
                <button class="btn btn-primary" id="startBtn" onclick="startGame()" disabled>🎮 Начать</button>
                <button class="btn btn-green" id="nightBtn" onclick="goToNight()" disabled>🌙 Ночь</button>
                <button class="btn btn-blue" id="voteBtn" onclick="startVoting()" disabled>🗳️ Голосование</button>
            </div>

            <div class="log" id="gameLog"></div>
            <div id="gameOverArea"></div>
        </div>
    </div>

    <!-- МОДАЛКА РОЛИ -->
    <div class="modal" id="roleModal">
        <div class="modal-content">
            <div class="role-icon" id="modalRoleIcon"></div>
            <div class="role-name" id="modalRoleName"></div>
            <div class="role-description" id="modalRoleDesc"></div>
            <button class="btn btn-primary" onclick="closeRoleModal()" style="margin-top: 20px;">Понятно</button>
        </div>
    </div>

    <!-- ТАЙМЕР -->
    <div class="timer" id="timer"></div>

    <!-- ТУЛТИП КОПИРОВАНИЯ -->
    <div class="copy-tooltip" id="copyTooltip">✅ ID скопирован!</div>

    <script>
        // ============ КОНСТАНТЫ ============
        const ROLES = {
            MAFIA: 'Мафия',
            DON: 'Дон',
            SHERIFF: 'Шериф',
            DOCTOR: 'Доктор',
            CIVILIAN: 'Мирный житель'
        };

        const ROLE_ICONS = {
            'Мафия': '🔫',
            'Дон': '👑',
            'Шериф': '🔍',
            'Доктор': '💉',
            'Мирный житель': '👤'
        };

        const ROLE_DESC = {
            'Мафия': 'Вы - мафия. Ночью убивайте мирных жителей.',
            'Дон': 'Вы - дон мафии. Руководите мафией.',
            'Шериф': 'Вы - шериф. Ночью проверяйте игроков.',
            'Доктор': 'Вы - доктор. Ночью лечите игроков.',
            'Мирный житель': 'Вы - мирный житель. Найдите мафию.'
        };

        // ============ ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ============
        let peer = null;
        let connections = [];
        let myPeerId = '';
        let isHost = false;
        let myPlayerIndex = -1;
        let selectedPlayers = 3;
        let roomId = '';
        let gameState = {
            phase: 'day',
            day: 1,
            players: [],
            votes: {},
            started: false,
            over: false,
            nightActions: {}
        };
        let timerInterval = null;
        let currentTimer = 0;
        let nightActionTimer = 30; // секунды на ночные действия

        // ============ ВЫБОР ИГРОКОВ ============
        document.querySelectorAll('.player-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedPlayers = parseInt(this.dataset.count);
            });
        });

        // ============ ПОКАЗ УВЕДОМЛЕНИЙ ============
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        // ============ PEERJS ============
        function initPeer(id) {
            try {
                peer = new Peer(id, {
                    debug: 3,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:stun2.l.google.com:19302' },
                            { urls: 'stun:stun3.l.google.com:19302' },
                            { urls: 'stun:stun4.l.google.com:19302' },
                            { urls: 'stun:stun.services.mozilla.com:3478' }
                        ]
                    }
                });

                peer.on('open', (peerId) => {
                    myPeerId = peerId;
                    console.log('✅ Peer открыт:', peerId);
                    
                    if (isHost) {
                        roomId = peerId;
                        document.getElementById('roomIdDisplay').textContent = peerId;
                        addLog('✅ Комната создана: ' + peerId);
                        addLog('📱 Отправьте ID друзьям');
                    }
                });

                peer.on('connection', (conn) => {
                    console.log('📞 Входящее соединение от:', conn.peer);
                    
                    conn.on('open', () => {
                        console.log('✅ Соединение установлено с:', conn.peer);
                        
                        // Проверяем, не превышено ли количество игроков
                        if (connections.length >= selectedPlayers - 1) {
                            conn.send({
                                type: 'room-full',
                                message: 'Комната заполнена!'
                            });
                            setTimeout(() => conn.close(), 1000);
                            return;
                        }
                        
                        // Проверяем, не началась ли уже игра
                        if (gameState.started) {
                            conn.send({
                                type: 'game-already-started',
                                message: 'Игра уже началась!'
                            });
                            setTimeout(() => conn.close(), 1000);
                            return;
                        }
                        
                        connections.push(conn);
                        setupConnection(conn);
                        
                        // Назначаем индекс игроку
                        const playerIndex = connections.length;
                        if (playerIndex < selectedPlayers) {
                            console.log('👤 Назначаю индекс:', playerIndex);
                            conn.send({
                                type: 'assign-player',
                                playerIndex: playerIndex
                            });
                        }
                    });

                    conn.on('error', (err) => {
                        console.error('❌ Ошибка соединения:', err);
                    });
                });

                peer.on('disconnected', () => {
                    console.log('🔄 Переподключение...');
                    setTimeout(() => {
                        peer.reconnect();
                    }, 3000);
                });

                peer.on('error', (err) => {
                    console.error('❌ PeerJS ошибка:', err);
                    if (err.type === 'peer-unavailable') {
                        showError('❌ Комната не найдена! Проверьте ID.');
                    } else if (err.type === 'network') {
                        showError('❌ Проблема с сетью! Проверьте соединение.');
                    } else if (err.type === 'unavailable-id') {
                        showError('❌ ID уже занят! Попробуйте ещё раз.');
                    } else {
                        showError('❌ Ошибка: ' + err.type);
                    }
                });
            } catch (error) {
                console.error('❌ Ошибка инициализации PeerJS:', error);
                showError('❌ Не удалось инициализировать PeerJS');
            }
        }

        function setupConnection(conn) {
            conn.on('data', (data) => {
                console.log('📨 Получено:', data.type);
                handleData(data);
            });

            conn.on('close', () => {
                console.log('🔌 Соединение закрыто');
                const index = connections.indexOf(conn);
                if (index > -1) {
                    connections.splice(index, 1);
                }
                if (isHost) {
                    updateStatuses();
                    broadcast({ type: 'player-disconnected', playerIndex: index + 1 });
                }
            });
        }

        function broadcast(data) {
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send(data);
                }
            });
        }

        // ============ ОБРАБОТКА ДАННЫХ ============
        function handleData(data) {
            switch(data.type) {
                case 'assign-player':
                    myPlayerIndex = data.playerIndex;
                    console.log('🎯 Мой индекс:', myPlayerIndex);
                    if (gameState.players[myPlayerIndex]) {
                        gameState.players[myPlayerIndex].isConnected = true;
                        showRole(myPlayerIndex);
                        updateUI();
                        if (isHost) {
                            broadcast({ type: 'player-connected', playerIndex: myPlayerIndex });
                            checkAllConnected();
                        }
                    }
                    break;

                case 'room-full':
                    showError('❌ ' + data.message);
                    disconnectPeer();
                    break;

                case 'game-already-started':
                    showError('❌ ' + data.message);
                    disconnectPeer();
                    break;

                case 'player-connected':
                    if (gameState.players[data.playerIndex]) {
                        gameState.players[data.playerIndex].isConnected = true;
                        addLog('✅ Игрок ' + (data.playerIndex + 1) + ' подключился');
                        updateUI();
                        if (isHost) checkAllConnected();
                    }
                    break;

                case 'player-disconnected':
                    if (gameState.players[data.playerIndex]) {
                        gameState.players[data.playerIndex].isConnected = false;
                        addLog('❌ Игрок ' + (data.playerIndex + 1) + ' отключился');
                        updateUI();
                    }
                    break;

                case 'game-state':
                    gameState = data.gameState;
                    updateUI();
                    break;

                case 'vote':
                    if (gameState.players[data.targetId] && gameState.players[data.playerIndex]) {
                        gameState.votes[data.targetId] = (gameState.votes[data.targetId] || 0) + 1;
                        addLog(gameState.players[data.playerIndex].name + ' ➜ ' + gameState.players[data.targetId].name);
                        updateUI();
                    }
                    break;

                case 'start-game':
                    startGame();
                    break;

                case 'night':
                    goToNight();
                    break;

                case 'night-action':
                    handleNightAction(data);
                    break;

                case 'game-over':
                    gameState.over = true;
                    showGameOver(data.message);
                    break;
            }
        }

        function disconnectPeer() {
            if (peer) {
                peer.destroy();
            }
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            resetGame();
        }

        function resetGame() {
            connections = [];
            myPlayerIndex = -1;
            isHost = false;
            roomId = '';
            gameState = {
                phase: 'day',
                day: 1,
                players: [],
                votes: {},
                started: false,
                over: false,
                nightActions: {}
            };
        }

        // ============ СОЗДАНИЕ КОМНАТЫ ============
        function createRoom() {
            roomId = 'mafia-' + Math.random().toString(36).substr(2, 8);
            isHost = true;
            myPlayerIndex = 0;
            
            console.log('🏠 Создание комнаты:', roomId);
            initPeer(roomId);
            
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('roomIdDisplay').textContent = roomId;
            
            initGame();
            gameState.players[0].isConnected = true;
            showRole(0);
            updateUI();
            
            addLog('🏠 Комната создана');
            addLog('📋 ID: ' + roomId);
            addLog('⏳ Ожидание игроков...');
            addLog('👥 Нужно игроков: ' + selectedPlayers);
        }

        // ============ ПОДКЛЮЧЕНИЕ К КОМНАТЕ ============
        function joinRoom() {
            const inputRoomId = document.getElementById('roomIdInput').value.trim();
            if (!inputRoomId) {
                showError('❌ Введите ID комнаты!');
                return;
            }

            if (inputRoomId.length < 6) {
                showError('❌ ID комнаты слишком короткий!');
                return;
            }

            console.log('🔗 Подключение к:', inputRoomId);
            roomId = inputRoomId;
            isHost = false;
            
            const tempPeerId = 'player-' + Math.random().toString(36).substr(2, 8);
            initPeer(tempPeerId);
            
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            addLog('🔗 Подключение...');
            
            // Пробуем подключиться
            setTimeout(() => {
                try {
                    const conn = peer.connect(inputRoomId, { reliable: true });
                    
                    conn.on('open', () => {
                        console.log('✅ Подключено к хосту!');
                        connections.push(conn);
                        setupConnection(conn);
                        addLog('✅ Подключено!');
                        addLog('⏳ Ожидание роли...');
                    });
                    
                    conn.on('error', (err) => {
                        console.error('❌ Ошибка подключения:', err);
                        showError('❌ Не удалось подключиться! Комната не существует или хост офлайн.');
                        disconnectPeer();
                    });
                } catch (error) {
                    console.error('❌ Ошибка подключения:', error);
                    showError('❌ Не удалось подключиться!');
                    disconnectPeer();
                }
            }, 1000);
        }

        // ============ ИНИЦИАЛИЗАЦИЯ ИГРЫ ============
        function initGame() {
            const roles = generateRoles();
            gameState.players = [];
            
            for (let i = 0; i < selectedPlayers; i++) {
                gameState.players.push({
                    id: i,
                    name: 'Игрок ' + (i + 1),
                    role: roles[i],
                    isAlive: true,
                    isConnected: false,
                    avatar: ROLE_ICONS[roles[i]]
                });
            }
        }

        function generateRoles() {
            const roles = [];
            const mafiaCount = Math.max(1, Math.floor(selectedPlayers / 3));
            
            // Мафия
            if (mafiaCount > 1) roles.push(ROLES.DON);
            for (let i = 0; i < mafiaCount; i++) {
                if (!(mafiaCount > 1 && i === 0)) roles.push(ROLES.MAFIA);
            }
            
            // Спец. роли
            if (selectedPlayers >= 4) roles.push(ROLES.SHERIFF);
            if (selectedPlayers >= 5) roles.push(ROLES.DOCTOR);
            
            // Мирные жители
            while (roles.length < selectedPlayers) {
                roles.push(ROLES.CIVILIAN);
            }
            
            // Перемешиваем
            for (let i = roles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [roles[i], roles[j]] = [roles[j], roles[i]];
            }
            
            return roles;
        }

        // ============ UI ============
        function updateUI() {
            updateStatuses();
            updatePlayers();
            updatePhase();
            updateButtons();
        }

        function updateStatuses() {
            const container = document.getElementById('statusContainer');
            container.innerHTML = '';
            
            gameState.players.forEach(player => {
                const badge = document.createElement('div');
                badge.className = 'status-badge ' + (player.isConnected ? 'status-online' : 'status-waiting');
                badge.textContent = player.name + ': ' + (player.isConnected ? '✓' : '⏳');
                container.appendChild(badge);
            });
        }

        function updatePlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';
            
            gameState.players.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                if (!player.isAlive) card.classList.add('dead');
                if (player.id === myPlayerIndex) card.classList.add('me');
                
                // Показываем мафию для мафии
                if (gameState.over || (player.id === myPlayerIndex) || 
                    (isMafia(gameState.players[myPlayerIndex]) && isMafia(player))) {
                    card.classList.add('mafia');
                }
                
                card.innerHTML = `
                    <div class="player-avatar">${player.avatar}</div>
                    <div class="player-name">${player.name}</div>
                    <div class="player-role">${gameState.over ? player.role : (player.id === myPlayerIndex ? player.role : '???')}</div>
                    ${!player.isAlive ? '<div style="color: red; margin-top: 5px;">☠️ Мёртв</div>' : ''}
                `;
                
                if (gameState.phase === 'voting' && player.isAlive && player.id !== myPlayerIndex) {
                    card.onclick = () => voteFor(player.id);
                    card.style.cursor = 'pointer';
                    card.style.borderColor = 'var(--gold)';
                }
                
                grid.appendChild(card);
            });
        }

        function isMafia(player) {
            if (!player) return false;
            return player.role === ROLES.MAFIA || player.role === ROLES.DON;
        }

        function updatePhase() {
            const banner = document.getElementById('phaseBanner');
            if (gameState.phase === 'day') {
                banner.className = 'phase-banner phase-day';
                banner.textContent = '☀️ ДЕНЬ ' + gameState.day;
            } else if (gameState.phase === 'night') {
                banner.className = 'phase-banner phase-night';
                banner.textContent = '🌙 НОЧЬ ' + gameState.day;
            } else if (gameState.phase === 'voting') {
                banner.className = 'phase-banner phase-day';
                banner.textContent = '🗳️ ГОЛОСОВАНИЕ';
            }
        }

        function updateButtons() {
            const startBtn = document.getElementById('startBtn');
            const nightBtn = document.getElementById('nightBtn');
            const voteBtn = document.getElementById('voteBtn');
            
            if (isHost && !gameState.started) {
                const allConnected = gameState.players.every(p => p.isConnected);
                startBtn.disabled = !allConnected;
            }
            
            if (gameState.started && !gameState.over) {
                nightBtn.disabled = gameState.phase !== 'day';
                voteBtn.disabled = gameState.phase !== 'day';
            }
        }

        function addLog(msg) {
            const log = document.getElementById('gameLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = msg;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function copyRoomId() {
            navigator.clipboard.writeText(roomId).then(() => {
                const tooltip = document.getElementById('copyTooltip');
                tooltip.classList.add('show');
                setTimeout(() => tooltip.classList.remove('show'), 2000);
            });
        }

        function showRole(index) {
            const player = gameState.players[index];
            if (player) {
                document.getElementById('modalRoleIcon').textContent = player.avatar;
                document.getElementById('modalRoleName').textContent = player.role;
                document.getElementById('modalRoleDesc').textContent = ROLE_DESC[player.role];
                document.getElementById('roleModal').classList.add('show');
            }
        }

        function closeRoleModal() {
            document.getElementById('roleModal').classList.remove('show');
        }

        function checkAllConnected() {
            const allConnected = gameState.players.every(p => p.isConnected);
            if (allConnected) {
                document.getElementById('startBtn').disabled = false;
                addLog('✅ Все игроки подключены!');
                addLog('🎮 Можно начинать игру!');
            }
        }

        // ============ ТАЙМЕР ============
        function startTimer(seconds) {
            clearInterval(timerInterval);
            currentTimer = seconds;
            const timerEl = document.getElementById('timer');
            timerEl.classList.add('show');
            timerEl.textContent = '⏱️ ' + currentTimer;
            
            timerInterval = setInterval(() => {
                currentTimer--;
                timerEl.textContent = '⏱️ ' + currentTimer;
                
                if (currentTimer <= 0) {
                    clearInterval(timerInterval);
                    timerEl.classList.remove('show');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer').classList.remove('show');
        }

        // ============ ИГРОВАЯ ЛОГИКА ============
        function startGame() {
            if (gameState.started) return;
            
            // Проверяем, что все подключены
            if (!gameState.players.every(p => p.isConnected)) {
                showError('❌ Не все игроки подключены!');
                return;
            }
            
            gameState.started = true;
            gameState.phase = 'day';
            gameState.day = 1;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('nightBtn').disabled = false;
            document.getElementById('voteBtn').disabled = false;
            
            addLog('🎮 ИГРА НАЧАЛАСЬ!');
            addLog('☀️ День 1. Город просыпается');
            
            updateUI();
            
            if (isHost) {
                broadcast({ type: 'start-game' });
                broadcast({ type: 'game-state', gameState: gameState });
            }
        }

        function goToNight() {
            if (gameState.phase !== 'day') return;
            
            gameState.phase = 'night';
            gameState.nightActions = {};
            document.getElementById('nightBtn').disabled = true;
            document.getElementById('voteBtn').disabled = true;
            
            addLog('🌙 Ночь. Город засыпает...');
            startTimer(30);
            updateUI();
            
            if (isHost) {
                broadcast({ type: 'night' });
                broadcast({ type: 'game-state', gameState: gameState });
            }
        }

        function handleNightAction(data) {
            if (isHost) {
                gameState.nightActions[data.playerIndex] = data.action;
                
                // Проверяем, все ли действия выполнены
                const alivePlayers = gameState.players.filter(p => p.isAlive);
                const requiredActions = alivePlayers.filter(p => p.role === ROLES.MAFIA || p.role === ROLES.DON);
                
                if (Object.keys(gameState.nightActions).length >= requiredActions.length) {
                    performNightActions();
                }
            }
        }

        function performNightActions() {
            if (!isHost) return;
            
            const alive = gameState.players.filter(p => p.isAlive);
            const mafia = alive.filter(p => p.role === ROLES.MAFIA || p.role === ROLES.DON);
            const civilians = alive.filter(p => p.role !== ROLES.MAFIA && p.role !== ROLES.DON);
            
            // Мафия убивает
            if (mafia.length > 0 && civilians.length > 0) {
                let target;
                
                // Проверяем, выбрала ли мафия цель
                const mafiaActions = Object.values(gameState.nightActions);
                if (mafiaActions.length > 0) {
                    target = civilians[Math.floor(Math.random() * civilians.length)];
                } else {
                    target = civilians[Math.floor(Math.random() * civilians.length)];
                }
                
                // Доктор лечит
                const doctor = alive.find(p => p.role === ROLES.DOCTOR);
                let healedPlayer = null;
                if (doctor) {
                    healedPlayer = civilians[Math.floor(Math.random() * civilians.length)];
                }
                
                // Шериф проверяет
                const sheriff = alive.find(p => p.role === ROLES.SHERIFF);
                if (sheriff) {
                    const checkedPlayer = civilians[Math.floor(Math.random() * civilians.length)];
                    if (checkedPlayer && (isMafia(checkedPlayer))) {
                        addLog('🔍 Шериф нашёл мафию!');
                    }
                }
                
                // Применяем лечение
                if (healedPlayer && target && healedPlayer.id === target.id) {
                    addLog('💉 Доктор спас ' + target.name);
                } else if (target) {
                    target.isAlive = false;
                    addLog('☠️ Мафия убила: ' + target.name);
                }
            }
            
            if (checkWin()) return;
            
            gameState.day++;
            gameState.phase = 'day';
            gameState.votes = {};
            gameState.nightActions = {};
            
            document.getElementById('nightBtn').disabled = false;
            document.getElementById('voteBtn').disabled = false;
            stopTimer();
            
            addLog('☀️ День ' + gameState.day + '. Город просыпается');
            updateUI();
            
            broadcast({ type: 'game-state', gameState: gameState });
        }

        function startVoting() {
            if (gameState.phase !== 'day') return;
            
            gameState.phase = 'voting';
            gameState.votes = {};
            
            document.getElementById('voteBtn').disabled = true;
            document.getElementById('nightBtn').disabled = true;
            
            addLog('🗳️ Голосование началось!');
            updateUI();
            
            if (isHost) {
                setTimeout(() => {
                    // Боты голосуют
                    const alive = gameState.players.filter(p => p.isAlive);
                    alive.forEach(p => {
                        if (p.id !== myPlayerIndex && p.isConnected === false) {
                            const targets = alive.filter(t => t.id !== p.id);
                            const target = targets[Math.floor(Math.random() * targets.length)];
                            if (target) {
                                gameState.votes[target.id] = (gameState.votes[target.id] || 0) + 1;
                                addLog(p.name + ' ➜ ' + target.name);
                            }
                        }
                    });
                    
                    determineVoteResult();
                }, 5000);
            }
        }

        function voteFor(playerId) {
            if (gameState.phase !== 'voting') return;
            if (!gameState.players[myPlayerIndex].isAlive) return;
            
            gameState.votes[playerId] = (gameState.votes[playerId] || 0) + 1;
            addLog(gameState.players[myPlayerIndex].name + ' ➜ ' + gameState.players[playerId].name);
            
            if (isHost) {
                handleVote(myPlayerIndex, playerId);
            } else {
                broadcast({ type: 'vote', playerIndex: myPlayerIndex, targetId: playerId });
            }
            
            updateUI();
        }

        function handleVote(playerIndex, targetId) {
            gameState.votes[targetId] = (gameState.votes[targetId] || 0) + 1;
            addLog(gameState.players[playerIndex].name + ' ➜ ' + gameState.players[targetId].name);
            updateUI();
        }

        function determineVoteResult() {
            if (!isHost) return;
            
            let maxVotes = 0;
            let votedOut = null;
            
            Object.entries(gameState.votes).forEach(([playerId, votes]) => {
                if (votes > maxVotes) {
                    maxVotes = votes;
                    votedOut = parseInt(playerId);
                }
            });
            
            if (votedOut !== null && gameState.players[votedOut]) {
                gameState.players[votedOut].isAlive = false;
                addLog('🚫 Изгнан: ' + gameState.players[votedOut].name);
                addLog('Роль: ' + gameState.players[votedOut].role);
            } else {
                addLog('🤝 Никто не изгнан');
            }
            
            if (checkWin()) return;
            
            gameState.phase = 'day';
            gameState.votes = {};
            
            document.getElementById('voteBtn').disabled = false;
            document.getElementById('nightBtn').disabled = false;
            
            updateUI();
            broadcast({ type: 'game-state', gameState: gameState });
        }

        function checkWin() {
            const alive = gameState.players.filter(p => p.isAlive);
            const mafiaCount = alive.filter(p => p.role === ROLES.MAFIA || p.role === ROLES.DON).length;
            const civilianCount = alive.filter(p => p.role !== ROLES.MAFIA && p.role !== ROLES.DON).length;
            
            if (mafiaCount === 0) {
                showGameOver('🏆 Мирные жители победили!');
                return true;
            } else if (mafiaCount >= civilianCount) {
                showGameOver('🔫 Мафия победила!');
                return true;
            }
            
            return false;
        }

        function showGameOver(message) {
            gameState.over = true;
            gameState.phase = 'day';
            stopTimer();
            
            const area = document.getElementById('gameOverArea');
            area.innerHTML = `
                <div style="text-align: center; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 15px; margin-top: 20px;">
                    <h2 style="color: var(--gold); margin-bottom: 15px;">${message}</h2>
                    <h3 style="margin-bottom: 15px;">Роли игроков:</h3>
                    <div class="players-list">
                        ${gameState.players.map(p => `
                            <div class="player-info">
                                <span>${p.avatar} ${p.name}</span>
                                <span class="role">${p.role}</span>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-primary" onclick="location.reload()">🔄 Новая игра</button>
                </div>
            `;
            
            document.getElementById('nightBtn').disabled = true;
            document.getElementById('voteBtn').disabled = true;
            
            updateUI();
            
            if (isHost) {
                broadcast({ type: 'game-over', message: message });
            }
        }
    </script>
</body>
</html>
